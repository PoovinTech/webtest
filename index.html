<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>poov.in Website</title>
  <style>
    body {
      font-family: Georgia, 'Times New Roman', Times, serif;
      margin: 0;
      min-height: 100vh;
      text-align: center;
      background: linear-gradient(to bottom right, #780206, #061161);
      background-repeat: no-repeat;
      background-size: cover;
      padding: 20px;
      color: white;
    }

    header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 12px 24px;
      background: linear-gradient(90deg, #d35555, #7e41e1);
      color: aliceblue;
      border-radius: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      height: 80px;
      max-width: 1100px;
      margin: 0 auto;
    }

    header .title {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1.5px;
    }

    header img {
      height: 60px;
      width: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .content {
      margin-top: 50px;
    }

    .content h1 {
      font-size: 36px;
      color: #00e0ff;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
    }

    .content p {
      font-size: 20px;
      color: #f8e7ff;
    }

    .links {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    .links a {
      display: inline-block;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      text-decoration: none;
      color: white;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
    }

    .links a:hover {
      background: linear-gradient(135deg, #ffffff, #d4d4d4);
      color: #111;
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(0,0,0,0.6);
    }

    footer {
      margin-top: 60px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="title"><em>poov.in</em></div>
    <img src="https://github.com/PoovinTech/webtest/blob/test/favicon.png?raw=true" alt="poov.in logo">
  </header>

  <div class="content">
    <h1><b>Welcome To poov.in</b></h1>
    <p><i>Connect with me here:</i></p>
  </div>

  <div class="links">
    <a href="https://www.youtube.com/@poovinkural" target="_blank">YouTube</a>
    <a href="https://www.instagram.com/poovin_kural" target="_blank">Instagram</a>
    <a href="https://www.github.com/poovintech" target="_blank">GitHub</a>
    <a href="https://www.linkedin.com/in/poovarasan-perumal" target="_blank">LinkedIn</a>
  </div>

  <footer>
    © 2025 poov.in | Designed by Susila M
  </footer>
</body>
</html>
